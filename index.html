<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李子恒 Kevin Li</title>
    <meta name="description" content="李子恒 Kevin Li — PDSA at ByteDance, University of Michigan Alumni.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <div class="header-intro">
                <div class="header-photo">
                    <div class="photo-placeholder">KL</div>
                </div>
                <div class="header-text">
                    <h1 id="header-name"></h1>
                    <p class="subtitle" id="header-subtitle"></p>
                    <p class="tagline" id="header-tagline"></p>
                </div>
            </div>
            <div class="header-links" id="header-links">
                <!-- Rendered by JS -->
                <button class="lang-toggle" id="lang-toggle" title="Switch Language">
                    <span id="lang-label">EN</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="container">
            <div class="nav-links" id="nav-links">
                <!-- Rendered by JS -->
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <section id="about" class="section"></section>
            <section id="skills" class="section"></section>
            <section id="experience" class="section"></section>
            <section id="thoughts" class="section"></section>
            <section id="contact" class="section"></section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Kevin Li · <em>Keep looking, never settle!</em></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
